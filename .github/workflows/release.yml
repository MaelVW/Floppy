name: Release

# Baut FloppyHubSetup.exe und haengt es an ein GitHub-Release.
#
#   Veroeffentlichen:
#       git tag v1.0.0
#       git push origin v1.0.0
#
#   Danach liegt das Setup unter
#       https://github.com/MaelVW/Floppy/releases/latest
#   und kann von dort heruntergeladen werden.
#
#   Ohne Tag laesst sich der Build ueber "Run workflow" auch manuell starten
#   (dann nur als Artefakt, ohne Release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne fuehrendes v (z. B. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
            if (-not $v) { $v = '1.0.0' }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: PowerShell-Skripte pruefen
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errs = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs)
            if ($errs) {
              $bad++
              Write-Host "::error file=$($_.FullName),line=$($errs[0].Extent.StartLineNumber)::$($errs[0].Message)"
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($bad -gt 0) { throw "$bad Datei(en) mit Syntaxfehlern." }

      - name: PSScriptAnalyzer (nur Hinweise, bricht nicht ab)
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseSingularNouns,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingPositionalParameters,PSUseApprovedVerbs |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup bauen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          Write-Host "ISCC: $iscc"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\FloppyHub.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen ($LASTEXITCODE)" }
          Get-ChildItem dist

      - name: Pruefsumme erzeugen
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File "dist\$($_.Name).sha256.txt" -Encoding ascii
            Write-Host "$h  $($_.Name)"
          }

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FloppyHubSetup
          path: dist/*

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Floppy Hub ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.sha256.txt
          body: |
            ## Floppy Hub ${{ steps.ver.outputs.version }}

            Aus Disketten wird eine physische Steam-Library.

            ### Installation
            1. `FloppyHubSetup-${{ steps.ver.outputs.version }}.exe` herunterladen
            2. Ausfuehren - der Assistent fuehrt durch die Installation
            3. Zielordner frei waehlbar, Autostart optional

            Windows meldet bei unsignierten Setups eventuell "Computer geschuetzt"
            (SmartScreen). Ueber *Weitere Informationen* -> *Trotzdem ausfuehren*.

            ### Voraussetzungen
            - Windows 10 / 11
            - Windows PowerShell 5.1 (bei Windows dabei)
            - Diskettenlaufwerk als `A:` (USB-Floppy genuegt)

            Die Pruefsumme der EXE steht in der beiliegenden `.sha256.txt`.
