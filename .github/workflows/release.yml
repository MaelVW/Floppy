name: Release

# Baut FloppyHubSetup.exe (App- und Konsolen-Variante) und haengt es an ein GitHub-Release.
#
#   Veroeffentlichen:
#       git tag v2.0.0-beta.1
#       git push origin v2.0.0-beta.1
#
#   Versionen mit Bindestrich (z. B. 2.0.0-beta.1) werden als Pre-Release markiert.
#   Release-Text: docs/releases/v<Version>.md (falls vorhanden), sonst ein Standardtext.
#
#   Ohne Tag laesst sich der Build ueber "Run workflow" auch manuell starten
#   (dann nur als Artefakt, ohne Release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne fuehrendes v (z. B. 2.0.0-beta.1)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7.2'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
            if (-not $v -and (Get-Content app/src/FloppyHub.App/project.godot -Raw) -match 'config/version="([^"]+)"') { $v = $Matches[1] }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$(if ($v -like '*-*') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: PowerShell-Skripte pruefen
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $errs = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs)
            if ($errs) {
              $bad++
              Write-Host "::error file=$($_.FullName),line=$($errs[0].Extent.StartLineNumber)::$($errs[0].Message)"
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($bad -gt 0) { throw "$bad Datei(en) mit Syntaxfehlern." }

      - name: PSScriptAnalyzer (nur Hinweise, bricht nicht ab)
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseSingularNouns,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingPositionalParameters,PSUseApprovedVerbs |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Godot-Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot
            ~/AppData/Roaming/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-windows

      - name: Godot (.NET) und Windows-Exportvorlagen installieren
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot/releases/download/$v-stable"
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "$base/Godot_v$v-stable_mono_win64.zip" -OutFile "$dir\godot.zip"
          Expand-Archive "$dir\godot.zip" -DestinationPath $dir -Force
          Remove-Item "$dir\godot.zip"

          Invoke-WebRequest "$base/Godot_v$v-stable_mono_export_templates.tpz" -OutFile "$dir\templates.tpz"
          $target = Join-Path $env:APPDATA "Godot\export_templates\$v.stable.mono"
          New-Item -ItemType Directory -Force $target | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$dir\templates.tpz")
          foreach ($e in $zip.Entries) {
            if ($e.FullName -match '^templates/(windows_.*|version\.txt|icudt_godot\.dat)$') {
              [IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path $target $Matches[1]), $true)
            }
          }
          $zip.Dispose()
          Remove-Item "$dir\templates.tpz"

      - name: Godot in den PATH
        shell: pwsh
        run: |
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'godot') -Recurse -Filter 'Godot_v*_mono_win64_console.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Godot nicht gefunden.' }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Signier-Zertifikat bereitstellen (falls Secrets gesetzt)
        # Secrets (Settings -> Secrets and variables -> Actions):
        #   FLOPPY_SIGN_PFX_BASE64   PFX-Datei als Base64
        #   FLOPPY_SIGN_PFX_PASSWORD Passwort der PFX
        # Ohne Secrets wird unsigniert gebaut. Siehe docs/SIGNIERUNG.md.
        shell: powershell
        env:
          PFX_B64: ${{ secrets.FLOPPY_SIGN_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.FLOPPY_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "::notice::Kein Signier-Zertifikat hinterlegt - Setup wird UNSIGNIERT gebaut."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'floppy-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          "FLOPPY_SIGN_PFX=$pfx"                  | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FLOPPY_SIGN_PFX_PASSWORD=$env:PFX_PWD" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signier-Zertifikat bereitgestellt."

      - name: App + Setup bauen (signiert, wenn Zertifikat vorhanden)
        shell: powershell
        run: |
          .\build\Build-Installer.ps1 -Version "${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Build fehlgeschlagen ($LASTEXITCODE)" }
          Get-ChildItem dist

      - name: Zertifikat entfernen
        if: always()
        shell: powershell
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'floppy-sign.pfx'
          if (Test-Path $pfx) { Remove-Item $pfx -Force }

      - name: Pruefsumme erzeugen
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "FloppyHubSetup-${{ steps.ver.outputs.version }}.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File "dist\$($_.Name).sha256.txt" -Encoding ascii
            Write-Host "$h  $($_.Name)"
          }

      - name: Release-Text waehlen
        id: notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $file = "docs/releases/v$v.md"
          if (-not (Test-Path $file)) {
            $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @(
              "## Floppy Hub $v",
              '',
              'Aus Disketten wird eine physische Steam-Library.',
              '',
              "1. ``FloppyHubSetup-$v.exe`` herunterladen und ausfuehren",
              '2. Variante waehlen: **App** (grafisch) oder **Konsole** (wie Version 1)',
              '3. Zielordner frei waehlbar, Autostart optional',
              '',
              'Die Pruefsumme der EXE steht in der beiliegenden `.sha256.txt`.'
            ) | Set-Content $file -Encoding utf8
          }
          "path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FloppyHubSetup
          path: |
            dist/FloppyHubSetup-${{ steps.ver.outputs.version }}.exe
            dist/*.sha256.txt

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Floppy Hub ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/FloppyHubSetup-${{ steps.ver.outputs.version }}.exe
            dist/*.sha256.txt
