; ===========================================================================
;  FLOPPY LAUNCHER  ///  Konfiguration
; ===========================================================================
;  Diese Datei ist OPTIONAL. Fehlt sie, gelten die eingebauten Standardwerte.
;  Kommandozeilen-Parameter von FloppyLauncher.ps1 haben IMMER Vorrang vor
;  dieser Datei.
;
;  Format:   schluessel = wert       ; Text nach ';' oder '#' ist Kommentar
;  Listen:   mit Komma oder Semikolon trennen
;  Aendern -> speichern -> FloppyLauncher.ps1 neu starten.
; ===========================================================================


[drive]
; Laufwerksbuchstabe der Diskette.
letter = A:

; Pruefintervall in Sekunden (wie oft aufs Laufwerk geschaut wird).
poll_seconds = 3


[reference]
; Dateinamen im Wurzelverzeichnis der Diskette, die als Referenzdatei gelten.
file_names = game.txt, floppy.txt, launch.txt

; Endungen, die als "ausfuehrbar" akzeptiert werden (fuer run= / pcrun= und
; die automatische EXE-Suche).
executable_extensions = .exe, .bat, .cmd


[security]
; Ordner, aus denen pcrun= NIEMALS starten darf. %-Variablen werden ersetzt.
; Standard = das Windows-Verzeichnis (also auch System32, SysWOW64, ...).
blocked_roots = %SystemRoot%

; Wenn hier etwas steht, darf pcrun= NUR aus diesen Ordnern starten
; (Positivliste). Leer lassen = alles ausser blocked_roots ist erlaubt.
; Beispiel:  allowed_roots = D:\Spiele, C:\Games, %ProgramFiles%\Steam
allowed_roots =

; Sekunden, bis das Bestaetigungsfenster ohne Antwort automatisch abbricht.
confirm_timeout = 90

; true  = es wird NIE gefragt; bestaetigungspflichtige Starts (pcrun=,
;         mehrere EXE) entfallen dann komplett.
; false = normale Rueckfrage im zweiten Terminal.
non_interactive = false


[hub]
; true = eine Diskette mit "hub=1" (bzw. einem der key_names) in der
;        Referenzdatei oeffnet das Floppy Hub Menue.
enabled = true

; Schluessel in der Referenzdatei, die das Hub-Menue ausloesen.
key_names = hub, hubmenu, menu, floppyhub

; Skript, das dann gestartet wird (relativ zum Launcher-Ordner oder absolut).
script = FloppyHub.ps1


[log]
; Pfad der Protokolldatei. "" (leer) = nicht in eine Datei schreiben.
; Relativ = im Launcher-Ordner.
file = FloppyLauncher.log

; Ab dieser Groesse (in KB) wird die Logdatei einmalig zu .log.old rotiert.
; 0 = nie rotieren.
max_kb = 512


[ui]
; Farbschema des Bestaetigungsfensters (FloppyInterface.ps1):
;   green | amber | ice | mono
theme = green

; Versteckte Spielereien: Feiertags-Themes, Boot-Flimmern, zwinkernde
; Diskette, Titel-Sprueche, "bit-rot"-Glitch.  true / false
easter_eggs = true
